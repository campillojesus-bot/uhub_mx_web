name: Brújula - revisión
on:
  push:
    branches: [ajustes-raiz-v11]
  pull_request:
    branches: [ajustes-raiz-v11, v2-modelo, mejora-retos-continuidad]
  workflow_dispatch:
jobs:
  quality-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium
      - name: Start built Next.js app
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/uhub-next.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:3000/brujula > /dev/null; then
              echo "App running"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/uhub-next.log
          exit 1
      - name: Test both journeys, ties, edit, copy, mobile, desktop and reduced motion
        run: npx playwright test tests/brujula.spec.ts tests/continuidad.spec.ts tests/home-paraguas.spec.ts --reporter=line --workers=2
      - name: Attach Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: brujula-playwright-diagnostics
          path: |
            test-results/
            /tmp/uhub-next.log
          if-no-files-found: ignore
